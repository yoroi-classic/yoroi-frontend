version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 2
    groups:
      root-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: '/packages/yoroi-extension'
    schedule:
      interval: weekly
      day: tuesday
      time: '03:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 2
    groups:
      extension-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: '/packages/e2e-tests'
    schedule:
      interval: weekly
      day: wednesday
      time: '03:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 1
    groups:
      e2e-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: friday
      time: '03:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
