name: Tests

on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  Unit_tests:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'pull_request_review' && github.event.review && (github.event.review.state == 'approved' || contains(github.event.review.body, '/check') || contains(github.event.review.body, '/release-check')))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ steps.nvm.outputs.NVMRC }}'
      - name: Setup npm
        run: |
          corepack enable npm
          corepack prepare npm@10.9.7 --activate
          npm --version

      - name: Check toolchain baseline
        run: npm run check:toolchain

      - name: Check workflow action contracts
        run: npm run test:workflow-actions

      - name: Check EMURGO dependency inventory
        working-directory: ./packages/yoroi-extension
        run: |
          npm run check:emurgo-dependencies

      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: cache-npm-downloads
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-node-${{ steps.nvm.outputs.NVMRC }}-${{ hashFiles('package-lock.json', 'packages/yoroi-extension/package-lock.json', 'packages/e2e-tests/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install packages
        run: |
          ./ci-install-all.sh

      - name: tests
        run: |
          npm run test

      - name: Test DApp backend fixtures
        run: npm --prefix packages/e2e-tests run test:dapp-server

  Build_smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'pull_request_review' && github.event.review && (github.event.review.state == 'approved' || contains(github.event.review.body, '/check') || contains(github.event.review.body, '/release-check')))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ steps.nvm.outputs.NVMRC }}'
      - name: Setup npm
        run: |
          corepack enable npm
          corepack prepare npm@10.9.7 --activate
          npm --version

      - name: Check toolchain baseline
        run: npm run check:toolchain

      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: cache-npm-downloads
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-node-${{ steps.nvm.outputs.NVMRC }}-${{ hashFiles('package-lock.json', 'packages/yoroi-extension/package-lock.json', 'packages/e2e-tests/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install packages
        run: |
          ./ci-install-all.sh

      - name: Check e2e smoke specs
        working-directory: ./packages/e2e-tests
        run: |
          npm run test:ext:smoke:dry-run

      - name: Build extension
        working-directory: ./packages/yoroi-extension
        run: |
          npm run prod:build -- --env test --isE2E

      - name: Check build output
        working-directory: ./packages/yoroi-extension/build/js
        run: |
          test -f inject.js
