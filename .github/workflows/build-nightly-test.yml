name: Build Nightly for Testing

on:
  workflow_dispatch:

jobs:
  build-nightly:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read Node Version from .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ steps.nvm.outputs.NVMRC }}'

      - name: Setup npm
        run: |
          corepack enable npm
          corepack prepare npm@10.9.7 --activate
          npm --version

      - name: Install Dependencies
        run: |
          ./ci-install-all.sh

      - name: Build Nightly app
        working-directory: ./packages/yoroi-extension
        run: |
          npm run prod:nightly

      - name: Check if the Nightly build output is correct
        working-directory: ./packages/yoroi-extension/build/js
        run: |
          if [ ! -f inject.js ]; then
            echo "Build failed: inject.js not found"
            exit 1
          fi

      - name: Upload Nightly Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yoroi-nightly-build
          path: ./packages/yoroi-extension/Yoroi\ Nightly.zip
