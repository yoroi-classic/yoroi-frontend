name: E2E tests

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of e2e tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - extension
          - dapp
          - trezor
          - ledger
      run_quarantined_dapp_tests:
        description: 'Run quarantined DApp cases that depend on stale fixtures'
        required: false
        default: false
        type: boolean
  pull_request_review:
    types: [submitted]

jobs:
  Build-Extension:
    if: (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.test_type == 'all' ||
      github.event.inputs.test_type == 'extension' ||
      github.event.inputs.test_type == 'dapp' ||
      github.event.inputs.test_type == 'trezor' ||
      github.event.inputs.test_type == 'ledger')) ||
      (github.event.review &&
      (github.event.review.state == 'approved' ||
      contains(github.event.review.body, '/check')
      ))
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ steps.nvm.outputs.NVMRC }}'
          cache: 'npm'

      - name: Setup npm
        run: |
          corepack enable npm
          corepack prepare npm@10.9.7 --activate
          npm --version

      - name: Check toolchain baseline
        run: npm run check:toolchain

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-cache
        with:
          path: |
            **/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ steps.nvm.outputs.NVMRC }}-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.nvm.outputs.NVMRC }}-modules-
            ${{ runner.os }}-node-modules-

      - name: Install packages
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: |
          ./ci-install-all.sh

      - name: Build the test mainnet version
        working-directory: ./packages/yoroi-extension
        run: npm run test:build

      - name: Check if the app is built correctly
        working-directory: ./packages/yoroi-extension/build/js
        run: |
          if [ ! -f inject.js ]; then
            echo "Build failed: files not found"
            exit 1
          fi

      - name: Archive built app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: builtApp
          path: |
            ./packages/yoroi-extension/Yoroi-test.crx
          retention-days: 1
          overwrite: true

      - name: Build the wallet-backend test mainnet version
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'dapp' || github.event.inputs.test_type == 'trezor' || github.event.inputs.test_type == 'ledger'
        working-directory: ./packages/yoroi-extension
        run: npm run test:dapp:build

      - name: Archive wallet-backend test app
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'dapp' || github.event.inputs.test_type == 'trezor' || github.event.inputs.test_type == 'ledger'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: builtWalletBackend
          path: |
            ./packages/yoroi-extension/Yoroi-test.crx
          retention-days: 1
          overwrite: true

  E2E-Fixtures:
    if: (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.test_type == 'all' ||
      github.event.inputs.test_type == 'extension')) ||
      (github.event.review &&
      (
      github.event.review.state == 'approved' ||
      contains(github.event.review.body, '/check')
      ))
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.fixtures.outputs.available }}
      matrix: ${{ steps.fixtures.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ steps.nvm.outputs.NVMRC }}'

      - name: Test fixture contract
        working-directory: ./packages/e2e-tests
        run: npm run test:fixture-contract

      - name: Report protected wallet fixtures
        id: fixtures
        working-directory: ./packages/e2e-tests
        env:
          FIRST_SMOKE_TEST_WALLET: ${{ secrets.FIRST_SMOKE_TEST_WALLET }}
          TEST_WALLET_MAINNET_1: ${{ secrets.TEST_WALLET_MAINNET_1 }}
          SECOND_STATIC_TEST_WALLET: ${{ secrets.SECOND_STATIC_TEST_WALLET }}
          SECOND_SMOKE_TEST_WALLET: ${{ secrets.SECOND_SMOKE_TEST_WALLET }}
        run: node scripts/check-protected-fixtures.mjs --report-only

      - name: Note unavailable protected wallet fixtures
        if: steps.fixtures.outputs.available != 'true'
        run: |
          echo '::notice::Protected wallet fixtures are unavailable; secret-backed extension suites will not start, and the public NFT suite will still run. See the E2E-Fixtures job summary.'

  Extension:
    if: always() &&
      needs.Build-Extension.result == 'success' &&
      needs.E2E-Fixtures.outputs.matrix != '' &&
      ((github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.test_type == 'all' ||
      github.event.inputs.test_type == 'extension')) ||
      (github.event.review &&
      (
      github.event.review.state == 'approved' ||
      contains(github.event.review.body, '/check')
      )))
    runs-on: ubuntu-24.04
    needs: [Build-Extension, E2E-Fixtures]
    continue-on-error: true
    strategy:
      matrix: ${{ fromJSON(needs.E2E-Fixtures.outputs.matrix) }}

    steps:
      - uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        id: setup-chrome
        with:
          chrome-version: 'stable'
          install-chromedriver: true

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ steps.nvm.outputs.NVMRC }}'
          cache: 'npm'

      - name: Setup npm
        run: |
          corepack enable npm
          corepack prepare npm@10.9.7 --activate
          npm --version

      - name: Check toolchain baseline
        run: npm run check:toolchain

      - name: Cache e2e-tests node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules-cache
        with:
          path: |
            packages/e2e-tests/node_modules
            ~/.npm
          key: ${{ runner.os }}-e2e-tests-node-${{ steps.nvm.outputs.NVMRC }}-${{ steps.setup-chrome.outputs.chrome-version }}-${{ hashFiles('packages/e2e-tests/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-tests-node-${{ steps.nvm.outputs.NVMRC }}-
            ${{ runner.os }}-e2e-tests-node-

      - name: Install packages
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: ./packages/e2e-tests
        run: npm ci

      - name: Download app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: builtApp
          path: ./packages/yoroi-extension

      - name: Run tests
        working-directory: ./packages/e2e-tests
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          FIRST_SMOKE_TEST_WALLET: ${{ secrets.FIRST_SMOKE_TEST_WALLET }}
          TEST_WALLET_MAINNET_1: ${{ secrets.TEST_WALLET_MAINNET_1 }}
          SECOND_STATIC_TEST_WALLET: ${{ secrets.SECOND_STATIC_TEST_WALLET }}
          SECOND_SMOKE_TEST_WALLET: ${{ secrets.SECOND_SMOKE_TEST_WALLET }}
        run: npm run test:ext:${{ matrix.suite }}

      - name: Archive tests screenshots and logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testRunsData_E2E_tests_extension_${{ matrix.suite }}
          path: |
            ./packages/e2e-tests/mochawesome-report
            ./packages/e2e-tests/testRunsData

  DApp-General:
    if: (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.test_type == 'all' ||
      github.event.inputs.test_type == 'dapp')) ||
      (github.event.review &&
      (
      github.event.review.state == 'approved' ||
      contains(github.event.review.body, '/check')
      ))
    runs-on: ubuntu-24.04
    needs: [Build-Extension]

    steps:
      - uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        id: setup-chrome
        with:
          chrome-version: 'stable'
          install-chromedriver: true

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ steps.nvm.outputs.NVMRC }}'
          cache: 'npm'

      - name: Setup npm
        run: |
          corepack enable npm
          corepack prepare npm@10.9.7 --activate
          npm --version

      - name: Check toolchain baseline
        run: npm run check:toolchain

      - name: Cache e2e-tests node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules-cache
        with:
          path: |
            packages/e2e-tests/node_modules
            ~/.npm
          key: ${{ runner.os }}-e2e-tests-node-${{ steps.nvm.outputs.NVMRC }}-${{ steps.setup-chrome.outputs.chrome-version }}-${{ hashFiles('packages/e2e-tests/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-tests-node-${{ steps.nvm.outputs.NVMRC }}-
            ${{ runner.os }}-e2e-tests-node-

      - name: Install packages
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: ./packages/e2e-tests
        run: npm ci

      - name: Download app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: builtWalletBackend
          path: ./packages/yoroi-extension

      - name: Run tests
        working-directory: ./packages/e2e-tests
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          FIRST_SMOKE_TEST_WALLET: ${{ secrets.FIRST_SMOKE_TEST_WALLET }}
          TEST_WALLET_MAINNET_1: ${{ secrets.TEST_WALLET_MAINNET_1 }}
          SECOND_STATIC_TEST_WALLET: ${{ secrets.SECOND_STATIC_TEST_WALLET }}
          SECOND_SMOKE_TEST_WALLET: ${{ secrets.SECOND_SMOKE_TEST_WALLET }}
          RUN_QUARANTINED_DAPP_TESTS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_quarantined_dapp_tests == 'true' }}
        run: xvfb-run -a -e /dev/stdout -s "-screen 0 1600x900x24" npm run test:dapp

      - name: Archive tests screenshots and logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testRunsData_E2E_tests_dapp
          path: |
            ./packages/e2e-tests/mochawesome-report
            ./packages/e2e-tests/testRunsData

  Trezor:
    if: (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.test_type == 'all' ||
      github.event.inputs.test_type == 'trezor')) ||
      (github.event.review &&
      (
      github.event.review.state == 'approved' ||
      contains(github.event.review.body, '/check')
      ))
    runs-on: ubuntu-24.04
    needs: [Build-Extension]

    steps:
      - name: Run the trezor user environment
        run: |
          sudo docker run \
            -p 9001:9001 \
            -p 9002:9002 \
            -p 21326:21326 \
            -p 127.0.0.1:21325:21326 \
            -d ghcr.io/trezor/trezor-user-env:4c194889610c3f21f1da3799e7ddb82004fd4e91

      - uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        id: setup-chrome
        with:
          chrome-version: 'stable'
          install-chromedriver: true

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check out cardano-wallet-backend
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: yoroi-classic/cardano-wallet-backend
          ref: a1724a9ed3de2099bc3f03be104f20df462d4644
          path: cardano-wallet-backend

      - name: Read .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ steps.nvm.outputs.NVMRC }}'
          cache: 'npm'

      - name: Setup npm
        run: |
          corepack enable npm
          corepack prepare npm@10.9.7 --activate
          npm --version

      - name: Check toolchain baseline
        run: npm run check:toolchain

      - name: Cache e2e-tests node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules-cache
        with:
          path: |
            packages/e2e-tests/node_modules
            ~/.npm
          key: ${{ runner.os }}-e2e-tests-node-${{ steps.nvm.outputs.NVMRC }}-${{ steps.setup-chrome.outputs.chrome-version }}-${{ hashFiles('packages/e2e-tests/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-tests-node-${{ steps.nvm.outputs.NVMRC }}-
            ${{ runner.os }}-e2e-tests-node-

      - name: Install packages
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: ./packages/e2e-tests
        run: npm ci

      - name: Start mainnet cardano-wallet-backend
        working-directory: ./cardano-wallet-backend
        env:
          HOST: 127.0.0.1
          NETWORK: mainnet
          PORT: 21000
          PROVIDER: koios
        run: |
          npm ci
          npm run build
          npm start > "$RUNNER_TEMP/cardano-wallet-backend.log" 2>&1 &
          node ../packages/e2e-tests/helpers/walletBackendPreflight.mjs http://127.0.0.1:21000 mainnet

      - name: Download app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: builtWalletBackend
          path: ./packages/yoroi-extension

      - name: Run tests
        working-directory: ./packages/e2e-tests
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: xvfb-run -a -e /dev/stdout -s "-screen 0 1600x900x24" npm run test:trezor

      - name: Archive tests screenshots and logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testRunsData_E2E_tests_trezor
          path: |
            ./packages/e2e-tests/mochawesome-report
            ./packages/e2e-tests/testRunsData

      - name: Archive cardano-wallet-backend log
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cardano-wallet-backend_trezor
          path: ${{ runner.temp }}/cardano-wallet-backend.log

  Ledger:
    if: (github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.test_type == 'all' ||
      github.event.inputs.test_type == 'ledger')) ||
      (github.event.review &&
      (
      github.event.review.state == 'approved' ||
      contains(github.event.review.body, '/check')
      ))
    runs-on: ubuntu-24.04
    needs: [Build-Extension]
    steps:
      - name: Pull Speculos Docker image
        run: docker pull ghcr.io/ledgerhq/speculos:0.25.9

      - uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        id: setup-chrome
        with:
          chrome-version: 'stable'
          install-chromedriver: true

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check out cardano-wallet-backend
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: yoroi-classic/cardano-wallet-backend
          ref: a1724a9ed3de2099bc3f03be104f20df462d4644
          path: cardano-wallet-backend

      - name: Read .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ steps.nvm.outputs.NVMRC }}'
          cache: 'npm'

      - name: Setup npm
        run: |
          corepack enable npm
          corepack prepare npm@10.9.7 --activate
          npm --version

      - name: Check toolchain baseline
        run: npm run check:toolchain

      - name: Cache e2e-tests node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules-cache
        with:
          path: |
            packages/e2e-tests/node_modules
            ~/.npm
          key: ${{ runner.os }}-e2e-tests-node-${{ steps.nvm.outputs.NVMRC }}-${{ steps.setup-chrome.outputs.chrome-version }}-${{ hashFiles('packages/e2e-tests/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-tests-node-${{ steps.nvm.outputs.NVMRC }}-
            ${{ runner.os }}-e2e-tests-node-

      - name: Install packages
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: ./packages/e2e-tests
        run: npm ci

      - name: Start mainnet cardano-wallet-backend
        working-directory: ./cardano-wallet-backend
        env:
          HOST: 127.0.0.1
          NETWORK: mainnet
          PORT: 21000
          PROVIDER: koios
        run: |
          npm ci
          npm run build
          npm start > "$RUNNER_TEMP/cardano-wallet-backend.log" 2>&1 &
          node ../packages/e2e-tests/helpers/walletBackendPreflight.mjs http://127.0.0.1:21000 mainnet

      - name: Download app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: builtWalletBackend
          path: ./packages/yoroi-extension

      - name: Run tests
        working-directory: ./packages/e2e-tests
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: xvfb-run -a -e /dev/stdout -s "-screen 0 1600x900x24" npm run test:ledger

      - name: Archive tests screenshots and logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testRunsData_E2E_tests_ledger
          path: |
            ./packages/e2e-tests/mochawesome-report
            ./packages/e2e-tests/testRunsData

      - name: Archive cardano-wallet-backend log
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cardano-wallet-backend_ledger
          path: ${{ runner.temp }}/cardano-wallet-backend.log
